name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Instalar motores
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.0.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Escanear el propio código
        run: appsec-ai scan src --engines ai-security,gitleaks,osv-scanner --fail-on high
