<style>
:root {
  --paper: #f3f5f4; --surface: #ffffff; --ink: #12232a; --muted: #55666c; --line: #d5dddb;
  --accent: #0d5f5c; --accent-ink: #ffffff; --accent-soft: #dcebe8; --series: #00917f;
  --crit: #b4321f; --crit-soft: #fbe6e1; --warn: #9a5b00; --warn-soft: #fbefd9; --code-bg: #f7f9f8;
  --ok: #1d5b2c; --ok-soft: #e3f3e6;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1719; --surface: #162124; --ink: #e4ecea; --muted: #94a6a5; --line: #29393c;
    --accent: #5cc0b5; --accent-ink: #062321; --accent-soft: #173a38; --series: #35cbbd;
    --crit: #ff8a72; --crit-soft: #3a1c17; --warn: #f2b25c; --warn-soft: #382a14; --code-bg: #121c1e;
    --ok: #9be0ad; --ok-soft: #15301d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1719; --surface: #162124; --ink: #e4ecea; --muted: #94a6a5; --line: #29393c;
  --accent: #5cc0b5; --accent-ink: #062321; --accent-soft: #173a38; --series: #35cbbd;
  --crit: #ff8a72; --crit-soft: #3a1c17; --warn: #f2b25c; --warn-soft: #382a14; --code-bg: #121c1e;
  --ok: #9be0ad; --ok-soft: #15301d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.1rem; margin-bottom: 12px; } h3 { font-size: 1rem; }
code, .mono { font-family: var(--font-mono); font-size: 0.9em; }
a { color: var(--accent); }
button, select, input, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
header { border-bottom: 1px solid var(--line); background: var(--surface); }
header .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; margin-right: auto; }
.inline { display: flex; flex-direction: row; align-items: center; gap: 6px; }
nav.tabs { border-bottom: 1px solid var(--line); background: var(--surface); }
nav.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted);
                  border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.btn { text-decoration: none; display: inline-block; border: 1px solid var(--line); background: var(--surface);
       border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
select, input, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
textarea { width: 100%; min-height: 80px; }
label { display: grid; gap: 4px; font-size: 0.9rem; }
main.wrap { padding-block: 24px 48px; display: grid; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.tile .k { color: var(--muted); font-size: 0.85rem; display: flex; gap: 6px; align-items: center; }
.tile .v { font-family: var(--font-display); font-size: 2rem; font-weight: 800; line-height: 1.1; margin-top: 4px; }
.services { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.service { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
           display: grid; gap: 8px; align-content: start; text-align: left; }
button.service { cursor: pointer; }
button.service:hover { border-color: var(--accent); }
.service .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.service .count { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; }
.service .sevs { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.82rem; }
.service p { margin: 0; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.on { background: var(--ok-soft); color: var(--ok); }
.pill.off { background: var(--code-bg); color: var(--muted); border: 1px solid var(--line); }
.pill.trial { background: var(--accent-soft); color: var(--accent); }
.sev { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.sev::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
.sev-critical, .sev-high { color: var(--crit); } .sev-medium { color: var(--warn); } .sev-low, .sev-info { color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 0.82rem; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
tr.link { cursor: pointer; } tr.link:hover td { background: var(--accent-soft); }
.muted { color: var(--muted); }
.chart { position: relative; min-height: 220px; }
.chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; }
.chart .area { fill: var(--series); opacity: 0.12; }
.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
       padding: 8px 10px; font-size: 0.82rem; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); min-width: 150px; }
.tip b { display: block; margin-bottom: 4px; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; }
.finding { border-top: 1px solid var(--line); padding: 14px 0; }
.finding:first-child { border-top: 0; }
.finding h3 { font-family: var(--font-body); font-size: 1rem; font-weight: 600; margin: 4px 0; }
.finding pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 0.82rem; margin: 8px 0; }
.meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 0.85rem; }
.vote { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.empty { text-align: center; padding: 48px 16px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar h2 { margin: 0 auto 0 0; }
.notice { padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); margin: 0 0 12px; }
.notice.ok { background: var(--ok-soft); }
.checks { display: flex; gap: 8px 16px; flex-wrap: wrap; margin: 8px 0 12px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.form .full { grid-column: 1 / -1; }
.login { max-width: 420px; margin: 0 auto; display: grid; gap: 14px; }
.login-form { display: grid; gap: 14px; }
.or { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 0; }
.price { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; }
.price s { color: var(--muted); font-size: 0.9rem; font-weight: 400; margin-left: 6px; }
.status { font-weight: 600; color: var(--ink); }
.team-note { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 8px 0; }
.editor { display: grid; gap: 12px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.pt-rows { display: grid; gap: 12px; }
.pt-finding { display: grid; gap: 8px; grid-template-columns: 1fr 160px auto; align-items: end;
              border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.pt-finding .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .pt-finding { grid-template-columns: 1fr; } }
details > summary { cursor: pointer; color: var(--accent); }
[hidden] { display: none !important; }
</style>
</head>

// El DOM se construye con nodos de texto, nunca interpretando HTML: títulos, rutas y fragmentos vienen
// del código del cliente.
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, ""); else n.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c !== "" && c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", ...opts,
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { showLogin(); throw new Error("401"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

  state.catalog = await api(`/api/catalog?lang=${lang}`);
  $("logout").hidden = false;
  const sel = $("inst");

// -- tendencia: una serie, cruceta con desglose por severidad y vista de tabla -------------------------
let lastTrend = null;
function renderTrend(points) {
  lastTrend = points;
  // Se dibuja al ancho real: escalar un viewBox fijo encoge los textos de los ejes en móvil.
  const W = Math.max(280, Math.round($("trend").clientWidth || 640)), H = 220, P = { l: 34, r: 8, t: 10, b: 24 };
  const totals = points.map((p) => SEVERITIES.reduce((a, s) => a + p[s], 0));
  const max = Math.max(4, ...totals);
  const step = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  const top = Math.ceil(max / step) * step;
  const x = (i) => P.l + (i * (W - P.l - P.r)) / Math.max(1, points.length - 1);
  const y = (v) => P.t + (H - P.t - P.b) * (1 - v / top);
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": t("trend_title") });
  const grid = s("g", { class: "grid" }), axis = s("g", { class: "axis" });
  for (let v = 0; v <= top; v += step) {
    grid.append(s("line", { x1: P.l, x2: W - P.r, y1: y(v), y2: y(v) }));
    const lbl = s("text", { x: P.l - 6, y: y(v) + 4, "text-anchor": "end" }); lbl.textContent = v; axis.append(lbl);
  }
  [0, Math.floor((points.length - 1) / 2), points.length - 1].forEach((i) => {
    const lbl = s("text", { x: x(i), y: H - 6, "text-anchor": i === 0 ? "start" : i === points.length - 1 ? "end" : "middle" });
    lbl.textContent = new Date(points[i].date + "T00:00:00").toLocaleDateString(lang, { day: "numeric", month: "short" });
    axis.append(lbl);
  });
  const path = totals.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join("");
  svg.append(grid, axis,
    s("path", { class: "area", d: `${path}L${x(points.length - 1)},${y(0)}L${x(0)},${y(0)}Z` }),
    s("path", { class: "line", d: path }));
  const cross = s("line", { class: "cross", y1: P.t, y2: H - P.b, visibility: "hidden" });
  const dot = s("circle", { class: "dot", r: 5, visibility: "hidden" });
  svg.append(cross, dot);
  const tip = el("div", { class: "tip", hidden: true });
  const box = $("trend"); box.replaceChildren(svg, tip);
  const hit = s("rect", { x: P.l, y: 0, width: W - P.l - P.r, height: H, fill: "transparent" });
  svg.append(hit);
  const show = (evt) => {
    const r = svg.getBoundingClientRect();
    const px = ((evt.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(points.length - 1, Math.round(((px - P.l) / (W - P.l - P.r)) * (points.length - 1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(totals[i])); dot.setAttribute("visibility", "visible");
    tip.replaceChildren(el("b", {}, new Date(points[i].date + "T00:00:00").toLocaleDateString(lang), " · ", totals[i]),
      ...SEVERITIES.filter((sv) => points[i][sv]).map((sv) => el("div", { class: "row" }, sevLabel(sv), el("span", {}, points[i][sv]))));
    tip.hidden = false;
    const left = (x(i) / W) * r.width;
    tip.style.left = `${Math.min(r.width - tip.offsetWidth, Math.max(0, left + 12))}px`;
    tip.style.top = "8px";
  };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); });

  $("trend-table").replaceChildren(el("table", {},
    el("tr", {}, el("th", {}, t("date")), ...SEVERITIES.map((sv) => el("th", { class: "num" }, t(sv))), el("th", { class: "num" }, t("total"))),
    ...points.map((p, i) => el("tr", {}, el("td", {}, p.date), ...SEVERITIES.map((sv) => el("td", { class: "num" }, p[sv])),
                               el("td", { class: "num" }, totals[i])))));
}

// -- eventos globales ------------------------------------------------------------------------------
$("lang").addEventListener("click", async () => {
  lang = lang === "es" ? "en" : "es";
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
  if (!state.me) { showLogin(); return; }
  state.catalog = await api(`/api/catalog?lang=${lang}`);
  state.scans = {};
  renderTabs(); go(state.view, state.param);
});
$("inst").addEventListener("change", () => loadInstallation("overview"));
$("gh-lang").addEventListener("change", async (e) => {
  await api(`/api/installations/${encodeURIComponent(instId())}/preferences`, { method: "PATCH", body: JSON.stringify({ language: e.target.value }) });
  const inst = state.me.installations.find((i) => String(i.id) === instId());
  if (inst) inst.language = e.target.value;
});
$("logout").addEventListener("click", async () => { await api("/auth/logout", { method: "POST" }).catch(() => {}); location.href = "/app"; });
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (lastTrend && $("trend")) renderTrend(lastTrend); }, 150); });
boot();
</script>
</body>
</html>
