[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-ai"
version = "0.1.0"
description = "Escáner de seguridad de código y de aplicaciones con IA: motores open source + triage con Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "pydantic>=2.6",
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# Servicio SaaS: API de webhooks, worker y base de datos.
service = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "httpx>=0.27", "pyjwt[crypto]>=2.9", "psycopg[binary]>=3.2", "dnspython>=2.6",
           "alembic>=1.13"]
iac = ["checkov>=3.2"]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
appsec-ai = "appsec_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appsec_ai = ["rules/**/*.yaml", "service/migrations/*.py", "service/migrations/*.mako",
             "service/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
