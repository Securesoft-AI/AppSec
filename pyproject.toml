[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-ai"
version = "0.1.0"
description = "Escáner de seguridad de código y de aplicaciones con IA: motores open source + triage con Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "pydantic>=2.6",
]

[project.optional-dependencies]
iac = ["checkov>=3.2"]
dev = ["pytest>=8"]

[project.scripts]
appsec-ai = "appsec_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
